name: bobarr

services:
  bobarr:
    build:
      context: .
    image: ${BOBARR_IMAGE:-bobarr-v2:0.1.0}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      BOBARR_CONFIG_DIR: /config
      BOBARR_MEDIA_DIR: /media
      BOBARR_COOKIE_SECURE: ${BOBARR_COOKIE_SECURE:-false}
      BOBARR_SHUTDOWN_TIMEOUT_MS: ${BOBARR_SHUTDOWN_TIMEOUT_MS:-15000}
      BOBARR_MASTER_KEY: ${BOBARR_MASTER_KEY:-}
      BOBARR_TRANSMISSION_USERNAME: ${TRANSMISSION_USERNAME:-bobarr}
      BOBARR_TRANSMISSION_PASSWORD: ${TRANSMISSION_PASSWORD:?Set TRANSMISSION_PASSWORD in .env}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${BOBARR_CONFIG_PATH:-./config}:/config
      - ${BOBARR_MEDIA_PATH:-./media}:/media
    ports:
      - ${BOBARR_BIND_ADDRESS:-0.0.0.0}:${BOBARR_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      transmission:
        condition: service_started
      jackett:
        condition: service_started
    networks:
      - backend

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2251-ls468@sha256:fafdf793ad8c49ba2d4f8d51f5a0fd88e5aad85aa866126e7a30b21f1d2ac4aa
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:uid=${PUID:-1000},gid=${PGID:-1000},exec
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      AUTO_UPDATE: "false"
    volumes:
      - ${JACKETT_CONFIG_PATH:-./config/jackett}:/config
    ports:
      - ${JACKETT_BIND_ADDRESS:-0.0.0.0}:${JACKETT_PORT:-9117}:9117
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls355@sha256:ac4299ee4ad7c4de3bbe00200bb1136651818b58e189d755f5d58a40ac986698
    restart: unless-stopped
    stop_grace_period: 2m
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:uid=${PUID:-1000},gid=${PGID:-1000},exec
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      USER: ${TRANSMISSION_USERNAME:-bobarr}
      PASS: ${TRANSMISSION_PASSWORD:?Set TRANSMISSION_PASSWORD in .env}
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
      WHITELIST: 127.0.0.1,172.*.*.*,10.*.*.*,192.168.*.*
      HOST_WHITELIST: transmission,gluetun
    volumes:
      - ${TRANSMISSION_CONFIG_PATH:-./config/transmission}:/config
      - ${BOBARR_MEDIA_PATH:-./media}:/media
    ports:
      - 127.0.0.1:${TRANSMISSION_WEB_PORT:-9091}:9091
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --user "$${USER}:$${PASS}" http://127.0.0.1:9091/transmission/web/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    internal: false
